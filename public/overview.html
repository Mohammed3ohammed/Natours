<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,300i,700"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="shortcut icon" type="image/png" href="img/favicon.png" />

    <title>Natours | Exciting tours for adventurous people</title>
  </head>
<body>
    <header class="header">
                <nav class="nav nav--tours">
            <a href="/overview.html" class="nav__el">All tours</a>
            <form class="nav__search">
                <button class="nav__search-btn">
                    <svg>
                        <use xlink:href="img/icons.svg#icon-search"></use>
                    </svg>
                </button>
                <input type="text" placeholder="Search tours" class="nav__search-input" />
            </form>
        </nav>
        <div class="header__logo">
            <img src="img/logo-white.png" alt="Natours logo" />
        </div>
        <nav class="nav nav--user">
            <a href="#" class="nav__el">My bookings</a>
            <button class="nav__el">Log out</button>
            <a href="#" class="nav__el">
                <img src="img/user.jpg" alt="User photo" class="nav__user-img" />
                <span>Mohammed</span>
            </a>
        </nav>
    </header>

    <main class="main">
        <div class="card-container">
            <div class="card">
                <div class="card__header">
                    <div class="card__picture">
                        <div class="card__picture-overlay">
                            <img
                                src="img/tours/tour-1-cover.jpg"
                                alt="Tour 1"
                                class="card__picture-img"
                        />
                        </div>

                        <h3 class="heading-tertirary">
                            <span>The Forest Hiker</span>
                        </h3>
                    </div>

                    <div class="card__details">
                        <div class="card__sub-heading">Esay 5-day tour</div>
                        <p class="card__text">
                                Breathtaking hike through the Canadian Banff National Park
                        </p>
                        <div class="card__data">
                            <svg class="card__icon">
                            <use xlink:href="img/icons.svg#icon-map-pin"></use>
                            </svg>
                            <span>Banff, Canada</span>
                        </div>
                        <div class="card__data">
                            <svg class="card__icon">
                            <use xlink:href="img/icons.svg#icon-calendar"></use>
                            </svg>
                            <span>April 2021</span>
                        </div>
                        <div class="card__data">
                            <svg class="card__icon">
                            <use xlink:href="img/icons.svg#icon-flag"></use>
                            </svg>
                            <span>3 stops</span>
                        </div>
                        <div class="card__data">
                            <svg class="card__icon">
                            <use xlink:href="img/icons.svg#icon-user"></use>
                            </svg>
                            <span>25 people</span>
                        </div>
                    </div>

                    
                </div>
            </div>
        </div>
    </main>
</body>
</html>
